# Calidad del Panel en cada pull request y en Dev/main.
# Mismo Node que la imagen de producción (Dockerfile: node:20).
name: CI

on:
  pull_request:
    branches: [Dev, main]
  push:
    branches: [Dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Formato, tokens, lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato (Prettier)
        run: pnpm format:check
      - name: Tokens generados al día (tokens.json)
        run: pnpm tokens:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Pruebas de integración
        run: pnpm test:integracion

  contrato:
    name: Contrato con api-tickets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rama del API que corresponde: QA para Dev, main para main.
    env:
      API_REF: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'QA' }}
      TIENE_TOKEN: ${{ secrets.API_TICKETS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Aviso si falta el token
        if: env.TIENE_TOKEN != 'true'
        run: echo "::notice::Configura el secreto API_TICKETS_TOKEN (lectura de EMETRA/api-tickets) para verificar el contrato."
      - uses: actions/checkout@v4
        if: env.TIENE_TOKEN == 'true'
        with:
          repository: EMETRA/api-tickets
          ref: ${{ env.API_REF }}
          token: ${{ secrets.API_TICKETS_TOKEN }}
          path: api-tickets
      - uses: pnpm/action-setup@v4
        if: env.TIENE_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.TIENE_TOKEN == 'true'
        with:
          node-version: 20
          cache: pnpm
      - if: env.TIENE_TOKEN == 'true'
        run: pnpm install --frozen-lockfile
      - name: Definiciones, rutas REST y operaciones GraphQL
        if: env.TIENE_TOKEN == 'true'
        run: pnpm contrato
        env:
          API_TICKETS_DIR: api-tickets

  storybook:
    name: Storybook compila
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

  e2e:
    name: Accesibilidad y experiencia (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium para Playwright
        run: pnpm e2e:instalar
      - name: Pruebas sobre el laboratorio local (datos ficticios)
        run: pnpm e2e
        env:
          CI: "true"
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  navegador:
    name: Flujos de negocio en navegador
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: calidad
    env:
      API_REF: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'QA' }}
      TIENE_TOKEN: ${{ secrets.API_TICKETS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: env.TIENE_TOKEN == 'true'
        with:
          repository: EMETRA/api-tickets
          ref: ${{ env.API_REF }}
          token: ${{ secrets.API_TICKETS_TOKEN }}
          path: api-tickets
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API compilado (pruebas que cargan su código)
        if: env.TIENE_TOKEN == 'true'
        working-directory: api-tickets
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Chromium para Playwright
        run: pnpm e2e:instalar
      - name: Build de producción
        run: pnpm build
      - name: Laboratorio local en segundo plano
        run: |
          pnpm laboratorio > laboratorio.log 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:3030/__laboratorio && exit 0; sleep 2; done
          cat laboratorio.log; exit 1
      - name: Pruebas de navegador por flujo
        run: pnpm test:navegador
        env:
          API_TICKETS_DIR: ${{ github.workspace }}/api-tickets
