# Compose 2.24 o posterior. El perfil qa se dirige al servicio panel.
x-entorno-panel: &entorno-panel
  - path: .env
    required: false
  - path: .env.tickets
    required: false

services:
  sistema-tickets-web:
    container_name: sistema-tickets-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file: *entorno-panel
    environment:
      TICKETS_ERROR_QUEUE_DIR: /var/lib/tickets-incidencias
    volumes:
      - tickets-incidencias:/var/lib/tickets-incidencias
  panel:
    profiles: [qa]
    build:
      context: .
      dockerfile: Dockerfile
    image: sistema-tickets:qa
    container_name: panel-vivi-qa
    ports:
      - "${FRONT_PORT:-4011}:3000"
    env_file: *entorno-panel
    environment:
      NODE_ENV: production
      GRAPHQL_ENDPOINT: "${QA_GRAPHQL_ENDPOINT:-http://api-tickets-vivi-qa:3003/graphql}"
      APP_PORT: "3000"
    restart: unless-stopped
    init: true
    networks: [vivi-qa-cierre]

volumes:
  tickets-incidencias:

networks:
  vivi-qa-cierre:
    name: ${TICKETS_VIVI_NETWORK:-vivi-qa-cierre}
    external: true
