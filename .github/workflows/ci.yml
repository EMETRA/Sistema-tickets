# Calidad del Panel en cada pull request y en Dev/main.
# Mismo Node que la imagen de producción (Dockerfile: node:20).
name: CI

on:
  pull_request:
    branches: [Dev, main]
  push:
    branches: [Dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Formato, tokens, lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato (Prettier)
        run: pnpm format:check
      - name: Tokens generados al día (tokens.json)
        run: pnpm tokens:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Pruebas de integración
        run: pnpm test:integracion

  storybook:
    name: Storybook compila
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

  e2e:
    name: Accesibilidad y experiencia (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium para Playwright
        run: pnpm e2e:instalar
      - name: Pruebas sobre el laboratorio local (datos ficticios)
        run: pnpm e2e
        env:
          CI: "true"
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
